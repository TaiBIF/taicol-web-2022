networks:
  gateway:
    external: true
  traefik-admin:
    external: true

services:
  react_app:
    depends_on:
      - mysql
    container_name: taicol-react-app
    restart: always
    expose:
      - 3000
    build:
      context: app
      dockerfile: Dockerfile
    volumes:
      - ./app:/app
      - ./app/node_modules:/app/node_modules
      - ./app/.next:/app/.next
      - ./app/public/upload:/app/public/upload
    env_file:
      - ./app/.env
    networks:
      - gateway
      - traefik-admin
    deploy:
      resources:
        limits:
          memory: 300M

  nginx-admin:
    container_name: nginx-admin
    image: nginx:latest
    restart: always
    volumes:
      - ./nginx/staging:/etc/nginx/conf.d
      - ./app/public/upload:/upload
    networks:
      - traefik-admin
    deploy:
      resources:
        limits:
          memory: 64M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nginx-admin.rule=Host(`web-admin.taicol.tw`)"
      - "traefik.http.routers.nginx-admin.entrypoints=websecure"
      - "traefik.http.routers.nginx-admin.tls.certresolver=myresolver"
      - "traefik.http.routers.nginx-admin.service=nginx-admin"
      - "traefik.http.services.nginx-admin.loadbalancer.server.port=80"
      # 版本名錄發佈 API（Step 10）：只允許更新服務（同 VPC 內部 IP）呼叫；其他來源回 403
      # 允許的來源寫在這個 yml 同一層的 .env（不是 app/.env）：RELEASE_PUBLISH_ALLOW_IP=172.31.37.6/32
      # 沒設時 docker compose 直接報錯，不會變成全部開放
      - "traefik.http.routers.nginx-admin-publish.rule=Host(`web-admin.taicol.tw`) && PathPrefix(`/api/publish`)"
      - "traefik.http.routers.nginx-admin-publish.priority=100"
      - "traefik.http.routers.nginx-admin-publish.entrypoints=websecure"
      - "traefik.http.routers.nginx-admin-publish.tls.certresolver=myresolver"
      - "traefik.http.routers.nginx-admin-publish.middlewares=publish-ipallow"
      - "traefik.http.routers.nginx-admin-publish.service=nginx-admin"
      - "traefik.http.middlewares.publish-ipallow.ipallowlist.sourcerange=${RELEASE_PUBLISH_ALLOW_IP:?請在 .env 設定 RELEASE_PUBLISH_ALLOW_IP}"
  mysql:
    container_name: taicol-react-mysql
    ports:
      - 127.0.0.1:3306:3306
    image: mysql:5.7
    restart: always
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "true"
    env_file:
      - ./app/.env
    volumes:
      - ./db:/var/lib/mysql:rw
      - ../../tc-web-volumes/bucket:/bucket
    command:
      [
        "mysqld",
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci",
        "--performance_schema=OFF",
        "--innodb_buffer_pool_size=64M"
      ]
    networks:
      - gateway
    deploy:
      resources:
        limits:
          memory: 300M