services:
  django:
    platform: linux/amd64
    build: .
    container_name: tc-web-django-dev-container
    image: tc-web-django-dev-image
    ports:
      - 8007:8007
    depends_on:
      - postgres
    volumes:
      - .:/code
      - ../tc-web-volumes/static:/tc-web-volumes/static
      - ../tc-web-volumes/media:/tc-web-volumes/media
      - ../tc-web-volumes/bucket:/bucket
    command: /srv/start
    env_file:
      - .env
  # 本機開發用：監看 react_src，存檔後自動重新 build 到 static/react_component/
  webpack:
    image: node:16-bullseye-slim
    container_name: tc-web-webpack-dev-container
    working_dir: /code
    # 依 package-lock.json 安裝且不改寫它（npm ci）；沒有 lock 檔時也不產生
    # --legacy-peer-deps：eslint-config-next@12 的 peer 會抓到最新 next 而與 react 17 衝突
    command: sh -c "if [ -f package-lock.json ]; then npm ci --legacy-peer-deps; else npm install --legacy-peer-deps --no-package-lock; fi && npm run watch"
    environment:
      - WATCHPACK_POLLING=true   # webpack 5 讀這個變數；macOS 的 Docker 需要輪詢才偵測得到存檔
    volumes:
      - .:/code
      - /code/node_modules   # 容器自己的 node_modules，不和主機的混用
  postgres:
    platform: linux/amd64
    build: ./postgres/
    image: tc-web-psql-dev-image
    shm_size: '1g'
    container_name: tc-web-postgres-container
    volumes:
      - ../tc-web-volumes/pgdata:/var/lib/postgresql/data/pgdata
      - ../tc-web-volumes/bucket:/bucket
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
    env_file:
     - .env
  mysql:
    # platform: linux/amd64
    build: ./scripts/mysql
    container_name: tc-web-mysql-container
    ports:
      - "3307:3306"
    image: tc-web-mysql-image
    volumes:
      - ../tc-web-volumes/mysql:/var/lib/mysql:rw
      - ../tc-web-volumes/bucket:/bucket
    command:
      [
        "mysqld",
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci",
      ]
  solr:
    platform: linux/amd64
    build: ./solr-workspace
    image: taicol-solr-image
    container_name: taicol-solr-container
    ports:
      - "8983:8983"
    volumes:
      - ../tc-web-volumes/solr:/var/solr
      - ../tc-web-volumes/bucket:/bucket
      - ./solr-workspace/:/workspace
    environment:
      - SOLR_JAVA_MEM=-Xms4g -Xmx4g